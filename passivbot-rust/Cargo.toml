[package]
name = "passivbot_rust"
version = "0.1.0"
edition = "2021"

[features]
# `python` enables the pyo3/numpy bindings (the `passivbot_rust` Python
# module). Building with `--no-default-features` yields a pure-Rust rlib
# (strategy engine + orchestrator only) usable from other Rust crates.
default = ["python", "extension-module", "abi3-py312"]
python = ["dep:pyo3", "dep:numpy"]
extension-module = ["python", "pyo3/extension-module"]
abi3-py312 = ["python", "pyo3/abi3-py312"]

[lib]
name = "passivbot_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21.2", optional = true }
ndarray = "0.15.6"
numpy = { version = "0.21.0", optional = true }
memmap = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num_enum = "0.7"
strum = "0.26"
strum_macros = "0.26"
log = "0.4"
